<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- Magnifying glass lens -->
  <circle cx="220" cy="200" r="100" fill="url(#glassGradient)" stroke="#ffffff" stroke-width="16"/>

  <!-- Inner lens highlight -->
  <circle cx="190" cy="170" r="25" fill="#ffffff" opacity="0.3"/>

  <!-- Magnifying glass handle -->
  <rect x="290" y="280" width="100" height="32" rx="16" fill="#ffffff" transform="rotate(45 290 280)"/>

  <!-- Connection nodes inside lens (representing MCP protocol) -->
  <circle cx="180" cy="200" r="12" fill="#10B981"/>
  <circle cx="220" cy="160" r="12" fill="#F59E0B"/>
  <circle cx="260" cy="200" r="12" fill="#EF4444"/>
  <circle cx="220" cy="240" r="12" fill="#3B82F6"/>

  <!-- Connection lines between nodes -->
  <line x1="180" y1="200" x2="220" y2="160" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="220" y1="160" x2="260" y2="200" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="260" y1="200" x2="220" y2="240" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="220" y1="240" x2="180" y2="200" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="180" y1="200" x2="260" y2="200" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="220" y1="160" x2="220" y2="240" stroke="#ffffff" stroke-width="3" opacity="0.8"/>

  <!-- Eye symbol (peek) in center of lens -->
  <ellipse cx="220" cy="200" rx="30" ry="20" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="220" cy="200" r="8" fill="#ffffff"/>
</svg>
